name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'
        cache-disabled: true
    - name: Build APK
      run: |
        gradle assembleDebug 2>&1 | tee build_log.txt
    - name: Upload Error Log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Error-Log
        path: build_log.txt
    - name: Prepare Direct APK
      if: success()
      run: |
        cp app/build/outputs/apk/debug/*.apk radio_player.apk
    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: radio_player
        path: radio_player.apk
    - name: Publish Direct APK Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1
        name: "Radio Player v2.1"
        body: |
          ### Что нового в версии 2.1:
          - Исправлено скачивание локальной базы: теперь скачиваются ВСЕ ~63 000 станций с сервера
          - Исправлена турецкая локализация: динамическое переключение языка, полный перевод процесса загрузки базы и сообщений
          - Полная поддержка автономной локальной базы радиостанций (radio_database.json)
          - Рекомендуется для пользователей из России в условиях блокировок серверов и замедлений
          - Загрузка и обновление базы прямо из приложения с отображением процесса
          - Возможность указать готовый файл radio_database.json из файлового менеджера устройства (например, скопированный с ПК)
          - Возможность удаления локальной базы в 1 клик для освобождения памяти
          - Поиск, популярные станции, страны и жанры работают мгновенно из локального файла без обращения к внешним серверам
          - Полная доступность для программ экранного доступа (TalkBack)
        files: radio_player.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
