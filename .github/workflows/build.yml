name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'
        cache-disabled: true
    - name: Build APK
      run: |
        gradle assembleDebug 2>&1 | tee build_log.txt
    - name: Upload Error Log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Error-Log
        path: build_log.txt
    - name: Prepare Direct APK
      if: success()
      run: |
        cp app/build/outputs/apk/debug/*.apk radio_player.apk
    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: radio_player
        path: radio_player.apk
    - name: Publish Direct APK Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.9
        name: "Radio Player v1.9"
        body: |
          ### Что нового в версии 1.9:
          - Фоновый таймер сна в службе: теперь гарантированно отключает радио вовремя, даже если приложение закрыто или экран выключен
          - Добавлен выбор 15, 30, 45, 60, 90 минут или ввод любого своего количества минут
          - В меню отображается оставшееся время таймера с возможностью быстрой отмены
          - Плавное нарастание и затухание звука (Fade in / Fade out) при включении, паузе и срабатывании таймера сна
          - Переключатель «Плавное нарастание и затухание звука» в Настройках (включается/выключается пользователем)
          - Все строки настроек объединены для быстрого управления в 1 свайп
        files: radio_player.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
